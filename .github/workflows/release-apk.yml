name: OpenLPS Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check release signing secrets
        shell: bash
        env:
          OPENLPS_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPENLPS_RELEASE_KEYSTORE_BASE64 }}
          OPENLPS_RELEASE_STORE_PASSWORD: ${{ secrets.OPENLPS_RELEASE_STORE_PASSWORD }}
          OPENLPS_RELEASE_KEY_ALIAS: ${{ secrets.OPENLPS_RELEASE_KEY_ALIAS }}
          OPENLPS_RELEASE_KEY_PASSWORD: ${{ secrets.OPENLPS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${OPENLPS_RELEASE_KEYSTORE_BASE64}"
          test -n "${OPENLPS_RELEASE_STORE_PASSWORD}"
          test -n "${OPENLPS_RELEASE_KEY_ALIAS}"
          test -n "${OPENLPS_RELEASE_KEY_PASSWORD}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install SDK platform, build-tools, NDK and CMake
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-33" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Decode release keystore
        shell: bash
        env:
          OPENLPS_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPENLPS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openlps-signing"
          printf '%s' "$OPENLPS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openlps-signing/openlps-release.jks"
          echo "OPENLPS_RELEASE_STORE_FILE=$RUNNER_TEMP/openlps-signing/openlps-release.jks" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          OPENLPS_RELEASE_STORE_PASSWORD: ${{ secrets.OPENLPS_RELEASE_STORE_PASSWORD }}
          OPENLPS_RELEASE_KEY_ALIAS: ${{ secrets.OPENLPS_RELEASE_KEY_ALIAS }}
          OPENLPS_RELEASE_KEY_PASSWORD: ${{ secrets.OPENLPS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/*.apk
          sha256sum app/build/outputs/apk/release/*.apk
          ls -l app/build/outputs/apk/release/*.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLPS-Network-Toolkit-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

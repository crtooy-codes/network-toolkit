name: OpenLPS Update Service

on:
  push:
    branches: [main]
    paths:
      - 'server/public/**'
      - 'server/schema/**'
      - 'server/scripts/**'
      - 'server/tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test update service contract
        run: python3 -m unittest discover -s server/tests -p 'test_*.py'

      - name: Prepare static service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/schema
          cp -R server/public/. _site/
          cp server/schema/manifest-v1.schema.json _site/schema/
          if [[ -e _site/v1/manifest.json || -e _site/v1/manifest.json.sig ]]; then
            test -s _site/v1/manifest.json
            test -s _site/v1/manifest.json.sig
            python3 server/scripts/validate_manifest.py \
              _site/v1/manifest.json _site/v1/manifest.json.sig
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
